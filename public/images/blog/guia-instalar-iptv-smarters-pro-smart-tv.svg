<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D61F2C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#AA151B" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA151B"/>
      <stop offset="35%" stop-color="#AA151B"/>
      <stop offset="35%" stop-color="#F1BF00"/>
      <stop offset="65%" stop-color="#F1BF00"/>
      <stop offset="65%" stop-color="#AA151B"/>
      <stop offset="100%" stop-color="#AA151B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#D61F2C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="850" cy="300" r="260" fill="#D61F2C" opacity="0.12" filter="blur(60px)"/>
  <circle cx="350" cy="450" r="200" fill="#F1BF00" opacity="0.08" filter="blur(60px)"/>

  <!-- Left Text Info -->
  <g transform="translate(100, 180)">
    <!-- Brand Badge -->
    <rect width="170" height="32" rx="16" fill="#D61F2C" fill-opacity="0.15" stroke="#D61F2C" stroke-opacity="0.4"/>
    <text x="85" y="21" fill="#FFC400" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">SMART TV GUÍA 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">IPTV Smarters Pro</text>
    <text x="0" y="135" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Samsung &amp; LG TV</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="18" font-weight="500">Configuración paso a paso en Tizen y webOS</text>

    <!-- Spanish Flag Line -->
    <rect y="210" width="140" height="4" rx="2" fill="url(#flagGrad)"/>

    <!-- Key Badges -->
    <g transform="translate(0, 235)">
      <rect width="115" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="57" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Xtream Codes</text>

      <rect x="125" width="105" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="177" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Guía EPG</text>

      <rect x="240" width="115" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="297" y="22" fill="#22C55E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">4K Ultra HD</text>
    </g>
  </g>

  <!-- Right Visual: Sleek Smart TV Illustration with Smarters Interface -->
  <g transform="translate(680, 140)" filter="url(#shadow)">
    <!-- TV Bezel -->
    <rect width="440" height="260" rx="14" fill="#0D0D0D" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    
    <!-- TV Screen -->
    <rect x="10" y="10" width="420" height="240" rx="8" fill="#141416"/>
    
    <!-- Header of App -->
    <rect x="10" y="10" width="420" height="35" fill="#1A1A1E"/>
    <circle cx="30" cy="27" r="6" fill="#D61F2C"/>
    <text x="45" y="31" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="800">REFLEXSAT IPTV — SMART TV</text>
    <rect x="360" y="20" width="55" height="15" rx="4" fill="#22C55E" fill-opacity="0.2"/>
    <text x="387" y="31" fill="#22C55E" font-family="'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle">ACTIVO</text>

    <!-- App Categories 3 Tiles -->
    <!-- Tile 1: Live TV -->
    <g transform="translate(25, 60)">
      <rect width="115" height="135" rx="8" fill="#D61F2C" fill-opacity="0.15" stroke="#D61F2C" stroke-opacity="0.4"/>
      <circle cx="57" cy="50" r="20" fill="#D61F2C"/>
      <polygon points="53,42 67,50 53,58" fill="#FFFFFF"/>
      <text x="57" y="90" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">EN VIVO</text>
      <text x="57" y="108" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">+35.000 Canales</text>
    </g>

    <!-- Tile 2: Películas VOD -->
    <g transform="translate(160, 60)">
      <rect width="115" height="135" rx="8" fill="#1C1C22" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="57" cy="50" r="20" fill="#26262E"/>
      <rect x="47" y="42" width="20" height="16" rx="2" fill="#FFC400"/>
      <text x="57" y="90" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">PELÍCULAS</text>
      <text x="57" y="108" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">4K / Full HD</text>
    </g>

    <!-- Tile 3: Series VOD -->
    <g transform="translate(295, 60)">
      <rect width="115" height="135" rx="8" fill="#1C1C22" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="57" cy="50" r="20" fill="#26262E"/>
      <circle cx="57" cy="50" r="8" fill="#00D084"/>
      <text x="57" y="90" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">SERIES</text>
      <text x="57" y="108" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Episodios VOD</text>
    </g>

    <!-- App Bottom Bar -->
    <rect x="25" y="210" width="385" height="22" rx="4" fill="#0A0A0C"/>
    <text x="35" y="225" fill="#71717A" font-family="'Inter', sans-serif" font-size="9">EPG Sincronizado | Horario España UTC+1 | Servidor Reflexsat CDN</text>

    <!-- TV Stand -->
    <polygon points="190,260 250,260 260,290 180,290" fill="#1A1A1A"/>
    <rect x="150" y="290" width="140" height="6" rx="3" fill="#333333"/>
  </g>
</svg>
