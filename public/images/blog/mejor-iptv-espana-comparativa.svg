<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA151B"/>
      <stop offset="35%" stop-color="#AA151B"/>
      <stop offset="35%" stop-color="#F1BF00"/>
      <stop offset="65%" stop-color="#F1BF00"/>
      <stop offset="65%" stop-color="#AA151B"/>
      <stop offset="100%" stop-color="#AA151B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#D61F2C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="850" cy="300" r="280" fill="#D61F2C" opacity="0.12" filter="blur(60px)"/>
  <circle cx="350" cy="450" r="220" fill="#FFD700" opacity="0.08" filter="blur(60px)"/>

  <!-- Left Text Info -->
  <g transform="translate(100, 180)">
    <!-- Brand Badge -->
    <rect width="190" height="32" rx="16" fill="#D61F2C" fill-opacity="0.15" stroke="#D61F2C" stroke-opacity="0.4"/>
    <text x="95" y="21" fill="#FFC400" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">COMPARATIVA 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Mejor IPTV España</text>
    <text x="0" y="135" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Análisis &amp; Criterios</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="18" font-weight="500">Estabilidad 99.9%, Fútbol 4K 60fps y VOD Actualizado</text>

    <!-- Spanish Flag Line -->
    <rect y="210" width="140" height="4" rx="2" fill="url(#flagGrad)"/>

    <!-- Key Badges -->
    <g transform="translate(0, 235)">
      <rect width="125" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="62" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Anti-Congelación</text>

      <rect x="135" width="115" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="192" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">LaLiga &amp; UCL</text>

      <rect x="260" width="120" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="320" y="22" fill="#22C55E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Servidores CDN</text>
    </g>
  </g>

  <!-- Right Visual: Comparison Card Deck -->
  <g transform="translate(680, 130)" filter="url(#shadow)">
    <!-- Main Comparison Card -->
    <rect width="440" height="300" rx="14" fill="#0D0D0D" stroke="#D61F2C" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Header of Card -->
    <rect width="440" height="45" rx="14" fill="#1A1A1E"/>
    <rect y="30" width="440" height="15" fill="#1A1A1E"/>
    <circle cx="25" cy="22" r="6" fill="#22C55E"/>
    <text x="40" y="27" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800">REFLEXSAT IPTV — SERVICIO PREMIUM Nº1</text>
    
    <!-- Rating Stars -->
    <g transform="translate(330, 16)">
      <polygon points="6,0 8,4 12,5 9,8 10,12 6,10 2,12 3,8 0,5 4,4" fill="#FFD700"/>
      <polygon points="20,0 22,4 26,5 23,8 24,12 20,10 16,12 17,8 14,5 18,4" fill="#FFD700"/>
      <polygon points="34,0 36,4 40,5 37,8 38,12 34,10 30,12 31,8 28,5 32,4" fill="#FFD700"/>
      <polygon points="48,0 50,4 54,5 51,8 52,12 48,10 44,12 45,8 42,5 46,4" fill="#FFD700"/>
      <polygon points="62,0 64,4 68,5 65,8 66,12 62,10 58,12 59,8 56,5 60,4" fill="#FFD700"/>
    </g>

    <!-- Comparison Table Inside Card -->
    <g transform="translate(20, 65)">
      <!-- Row 1: Canales -->
      <rect width="400" height="34" rx="6" fill="#141416"/>
      <text x="15" y="22" fill="#E4E4E7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Canales en directo:</text>
      <text x="385" y="22" fill="#22C55E" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="end">+35.000 (España + Int.)</text>

      <!-- Row 2: VOD -->
      <rect y="42" width="400" height="34" rx="6" fill="#18181B"/>
      <text x="15" y="64" fill="#E4E4E7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Películas y Series VOD:</text>
      <text x="385" y="64" fill="#FFD700" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="end">+120.000 títulos 4K</text>

      <!-- Row 3: Estabilidad -->
      <rect y="84" width="400" height="34" rx="6" fill="#141416"/>
      <text x="15" y="106" fill="#E4E4E7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Estabilidad en Directo:</text>
      <text x="385" y="106" fill="#22C55E" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="end">99.9% Uptime CDN</text>

      <!-- Row 4: Deportes -->
      <rect y="126" width="400" height="34" rx="6" fill="#18181B"/>
      <text x="15" y="148" fill="#E4E4E7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Fútbol &amp; Deportes:</text>
      <text x="385" y="148" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="end">4K UHD @ 60 FPS</text>

      <!-- Row 5: Soporte -->
      <rect y="168" width="400" height="34" rx="6" fill="#141416"/>
      <text x="15" y="190" fill="#E4E4E7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Soporte Técnico:</text>
      <text x="385" y="190" fill="#22C55E" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="end">WhatsApp 24/7 en Español</text>
    </g>

    <!-- Card Footer -->
    <rect x="20" y="275" width="400" height="15" fill="none"/>
    <text x="220" y="285" fill="#71717A" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Garantía de reembolso de 7 días | Prueba gratuita disponible</text>
  </g>
</svg>
