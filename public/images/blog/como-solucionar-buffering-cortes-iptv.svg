<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA151B"/>
      <stop offset="35%" stop-color="#AA151B"/>
      <stop offset="35%" stop-color="#F1BF00"/>
      <stop offset="65%" stop-color="#F1BF00"/>
      <stop offset="65%" stop-color="#AA151B"/>
      <stop offset="100%" stop-color="#AA151B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#22C55E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="850" cy="300" r="260" fill="#22C55E" opacity="0.1" filter="blur(60px)"/>
  <circle cx="350" cy="450" r="200" fill="#D61F2C" opacity="0.08" filter="blur(60px)"/>

  <!-- Left Text Info -->
  <g transform="translate(100, 180)">
    <!-- Brand Badge -->
    <rect width="210" height="32" rx="16" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" stroke-opacity="0.4"/>
    <text x="105" y="21" fill="#22C55E" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">OPTIMIZACIÓN &amp; RED</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Solución a Cortes</text>
    <text x="0" y="135" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">&amp; Buffering IPTV</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="18" font-weight="500">Configuración DNS, Caché de Búfer, Wi-Fi 5GHz y Red</text>

    <!-- Spanish Flag Line -->
    <rect y="210" width="140" height="4" rx="2" fill="url(#flagGrad)"/>

    <!-- Key Badges -->
    <g transform="translate(0, 235)">
      <rect width="115" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="57" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">DNS 1.1.1.1</text>

      <rect x="125" width="125" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="187" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Búfer 5 Segundos</text>

      <rect x="260" width="115" height="34" rx="8" fill="#1C1C1E" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="317" y="22" fill="#22C55E" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Cero Lag</text>
    </g>
  </g>

  <!-- Right Visual: Network Speed & Diagnostics Dashboard Graphic -->
  <g transform="translate(680, 140)" filter="url(#shadow)">
    <rect width="440" height="280" rx="14" fill="#0D0D0D" stroke="#22C55E" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- Header of Dashboard -->
    <rect width="440" height="40" rx="14" fill="#141814"/>
    <rect y="25" width="440" height="15" fill="#141814"/>
    <circle cx="25" cy="20" r="5" fill="#22C55E"/>
    <text x="40" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="800">REFLEXSAT STREAM ANALYZER — DIAGNÓSTICO ÓPTIMO</text>

    <!-- Speed Gauge Circle Graphic -->
    <g transform="translate(50, 65)">
      <circle cx="65" cy="65" r="55" fill="none" stroke="#222226" stroke-width="12"/>
      <circle cx="65" cy="65" r="55" fill="none" stroke="#22C55E" stroke-width="12" stroke-dasharray="270" stroke-dashoffset="40" stroke-linecap="round"/>
      <text x="65" y="60" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="22" font-weight="900" text-anchor="middle">600</text>
      <text x="65" y="78" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Mbps</text>
      <text x="65" y="94" fill="#22C55E" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">FIBRA 100%</text>
    </g>

    <!-- Diagnostics Metrics Cards -->
    <g transform="translate(200, 60)">
      <!-- Metric 1 -->
      <rect width="215" height="44" rx="6" fill="#141418" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="12" y="20" fill="#71717A" font-family="'Inter', sans-serif" font-size="10">LATENCIA / PING</text>
      <text x="12" y="36" fill="#22C55E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">8 ms (Óptimo)</text>

      <!-- Metric 2 -->
      <rect y="52" width="215" height="44" rx="6" fill="#141418" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="12" y="72" fill="#71717A" font-family="'Inter', sans-serif" font-size="10">JITTER (ESTABILIDAD)</text>
      <text x="12" y="88" fill="#22C55E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">0.8 ms (Sin Variación)</text>

      <!-- Metric 3 -->
      <rect y="104" width="215" height="44" rx="6" fill="#141418" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="12" y="124" fill="#71717A" font-family="'Inter', sans-serif" font-size="10">PAQUETES PERDIDOS</text>
      <text x="12" y="140" fill="#22C55E" font-family="'Inter', sans-serif" font-size="14" font-weight="800">0.00% (Transmisión Limpia)</text>
    </g>

    <!-- Checklist Bottom Section -->
    <g transform="translate(25, 205)">
      <rect width="390" height="55" rx="6" fill="#121812" stroke="#22C55E" stroke-opacity="0.2"/>
      <circle cx="20" cy="18" r="4" fill="#22C55E"/>
      <text x="32" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Conexión por cable Ethernet RJ45 Cat 6 recomendada</text>

      <circle cx="20" cy="38" r="4" fill="#22C55E"/>
      <text x="32" y="42" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Servidores Cloudflare 1.1.1.1 activados para evasión de throttling</text>
    </g>
  </g>
</svg>
